<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ '/assets/logo.png' | relative_url }}">
    <link rel="shortcut icon" type="image/png" href="{{ '/assets/logo.png' | relative_url }}">
    <!-- Jekyll theme will provide its own CSS; our custom CSS overrides small bits -->
    {{ head }}
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <div class="brand">
          <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
          {% include socials.html %}
        </div>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <!-- <a href="{{ '/about' | relative_url }}">About</a> -->
          <a href="{{ '/work' | relative_url }}">My Work</a>
          <a href="{{ '/notes' | relative_url }}">My Notes</a>
          <a href="{% if site.cv != "" and site.cv %}{{ site.cv | relative_url }}{% else %}{{ '/cv' | relative_url }}{% endif %}"{% if site.cv != "" and site.cv %} target="_blank" rel="noopener"{% endif %}>CV</a>
          <button id="theme-toggle" style="margin-left:1rem;">🌓</button>
        </nav>
      </div>
    </header>

    <main class="site-main inner">
      {{ content }}
    </main>

    <footer class="site-footer inner">
      <p>&copy; {{ site.time | date: "%Y" }}, {{ site.author }}</p>
    </footer>

    {{ content_for_footer }}

    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
